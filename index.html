<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <title>Velora</title>
  <style>
    html,body{margin:0;height:100%;background:#09090b;color:#f5eee6;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #boot{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    .mark{width:58px;height:58px;border-radius:20px;background:#ef405b;display:grid;place-items:center;margin:0 auto 18px;font-weight:800;font-size:25px;box-shadow:0 16px 40px rgba(239,64,91,.22)}
    h1{margin:0 0 8px;font-size:26px}p{margin:0;color:#99959a;line-height:1.5}.err{max-width:420px}.err button{margin-top:18px;border:0;border-radius:999px;padding:12px 18px;background:#ef405b;color:white;font-weight:700}
  </style>
</head>
<body>
<div id="boot"><div><div class="mark">V</div><h1>Velora</h1><p>Loading secure test build…</p></div></div>
<script>
(async()=>{
  try{
    const names=Array.from({length:10},(_,i)=>`chunks/${String(i).padStart(2,'0')}.txt`);
    const parts=await Promise.all(names.map(async n=>{
      const r=await fetch(n,{cache:'no-store'});
      if(!r.ok) throw new Error(`Missing ${n}`);
      return (await r.text()).trim();
    }));
    const b64=parts.join('');
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    if(!('DecompressionStream' in window)) throw new Error('This browser does not support the secure prototype loader. Update Chrome and try again.');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error(err);
    document.getElementById('boot').innerHTML=`<div class="err"><div class="mark">!</div><h1>Velora could not load</h1><p>${String(err.message||err)}</p><button onclick="location.reload()">Try again</button></div>`;
  }
})();
</script>
</body>
</html>
